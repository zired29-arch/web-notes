<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-Notes</title>
    <script src="./script.js" defer></script>
</head>
<body>
    <header>
        <div class="header-left">
            <div><img src="./img/notebook.png"></div>
            <div>Web-Notes</div>
        </div>
            <div class="header-right">
                <div class="statistics">
                    <div>Выполнено: <span>0</span></div>
                    <div>Не выполнено: <span>0</span></div>
                    <div>В процессе: <span>0</span></div>
                </div>
                 <div><button>Тёмная тема</button></div>
            </div>
        </div>
    </header>
    <main>
        <div class="input-block">
            <div><input type="text"></div>
            <button>+</button>
        </div>
        <button class="custom-btn btn-5"><span>Создать заметку</span></button>
        <div class="table">
            <div class="head">#</div>
            <div class="head">Taskname</div>
            <div class="head">Deadline</div>
            <div class="head">Status</div>
            <div class="head">Edit</div>
            <div class="head">Remove</div>

            <div>24</div>
            <div>Buy Grocery</div>
            <div>1d</div>
            <div>Todo</div>
            <div></div>
            <div></div>
        </div>
    </main>
    <footer>
        <img src="./img/notebook.png">
        <div>Web-Notes</div>
        <div>2026</div>
    </footer>
</body>
</html>
