<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-Notes</title>
    <script src="./script.js" defer></script>
</head>
<body>
    <header>
        <div class="header-left">
            <div><img src="./img/notebook.png"></div>
            <div>Web-Notes</div>
        </div>
            <div class="header-right">
                <div class="statistics">
                    <div>Выполнено: <span>0</span></div>
                    <div>Не выполнено: <span>0</span></div>
                    <div>В процессе: <span>0</span></div>
                </div>
                 <div><button class="theme"><img src="./img/dark-theme.png"></button></div>
            </div>
        </div>
    </header>

    <main>
        <div class="input-block">
            <div><input class="input-task" type="text" placeholder="Введите задачу"></div>
            <div><input class="input-date" type="date"></div>
            <select class="select-status">
                <option value="Не выполнено">Не выполнено</option>
                <option value="В процессе">В процессе</option>
                <option value="Выполнено">Выполнено</option>
            </select>
            <button class="add-task">+</button>
        </div>

        <button class="custom-btn btn-5"><span>Создать заметку</span></button>
        <div class="table">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Taskname</th>
                        <th>Deadline</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody class="tasks-list">
                    <tr>
                        <td>#</td>
                        <td>Taskname</td>
                        <td>Deadline</td>
                        <td>Status</td>
                        <td>
                            <button><img src="./img/pencil.png"></button>
                            <button><img src="./img/trashcan.png"></button>
                        </td>
                    </tr>
                    <tr>
                        <td>#</td>
                        <td>Taskname</td>
                        <td>Deadline</td>
                        <td>Status</td>
                        <td>
                            <button><img src="./img/pencil.png"></button>
                            <button><img src="./img/trashcan.png"></button>
                        </td>
                    </tr>
                    <!-- Задачи будут добавляться через JS -->
                </tbody>
            </table>
        </div>
        <!-- <div class="table">
            <div class="head">#</div>
            <div class="head">Taskname</div>
            <div class="head">Deadline</div>
            <div class="head">Status</div>
            <div class="head">Edit</div>
            <div class="head">Remove</div>

            <div>24</div>
            <div>Buy Grocery</div>
            <div>1d</div>
            <div>Todo</div>
            <div></div>
            <div></div>
        </div> -->
    </main>

    <footer>
        <img src="./img/notebook.png">
        <div>Web-Notes</div>
        <div>2026</div>
    </footer>
</body>
</html>
